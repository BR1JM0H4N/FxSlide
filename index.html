<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FxSlide</title>
  <style>
:root {
    --bg: var( --md-surfaceVariant, #22271E);
    --fg: var(  --md-onSurface,#E2E8D9);
    --mut: var(  --md-onSurfaceVariant, #A7ADA0);
    --card: var(  --md-surfaceContainer, #161B14);
    --surface: var(  --md-surface, #0C0F0A);
    --surface-container: var(--card);
    --surface-high: var(  --md-surfaceContainerHigh, #1C2119);
    --line: var( --md-outlineVariant, #49454F);
    --outline: var(--line);
    --acc: var(  --md-secondary, #BCCBB1);
    --accfg: var(--bg);
    --acc-container: var(  --md-onSecondary, #374430);
    --on-acc-container: var(--fg);
    --track: var(--acc-container);
    box-sizing: border-box;
    padding-top: var(--safe-area-inset-top,0px);
    padding-bottom: var(--safe-area-inset-bottom,0px);
  }

    @font-face {
      font-family: "VarelaR";
      src: url(./VarelaRound-Regular.ttf);
    }

    html {
      scroll-padding-top: var(--safe-area-inset-top,0px);
      background: var(--bg);
      -webkit-user-select: none;
      user-select: none;
    }

    * {
      box-sizing: border-box
    }
    .safe-top-patch {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;

      /* Automatically scales to the safe zone + extra breathing room for the fade */
      height: calc(var(--safe-area-inset-top, 0px));

      /* Fixes the broken gradient syntax */
      background-color: var(--bg);

      z-index: 9999;
      pointer-events: none;
    }


    .safe-bottom-patch {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;

      /* Automatically scales to the safe zone + extra breathing room for the fade */
      height: calc(var(--safe-area-inset-bottom, 0px));

      /* Fixes the broken gradient syntax */
      background-color: var(--bg);

      z-index: 9999;
      pointer-events: none;
    }
    body {

      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: VarelaR !important;
      font: 16px/1.5 VarelaR, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    h1 {

      width: 100%;
      font: 400 2rem/1.2 "Google Sans", Roboto, system-ui, sans-serif;
      letter-spacing: -.02em;
      margin: 0 0 16px;
      display: flex;
      justify-content: center;
      background-color: var(--bg);
    }

    p.sub {
      margin: 0 0 20px;
      color: var(--mut);
      font-size: .95rem;
      line-height: 1.45;
    }

    canvas {
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      background: #000;
      border-radius: 20px;
      display: block;
      box-shadow: 0 1px 3px rgba(0,0,0,.16);
    }

    #res {
      color: var(--mut)!important;
      font-size: .8rem!important;
      margin-top: 8px!important;
      padding-left: 4px;
    }

    .card {
      background: var(--card);
      border: 0;
      border-radius: 20px;
      padding: 20px;
      margin-top: 16px;
      box-shadow: none;
    }

    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      font-size: .9rem;
      font-weight: 500;
      letter-spacing: .01em;
    }

    label span {
      color: var(--mut);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    input[type=range] {
      width: 100%;
      height: 32px;
      accent-color: var(--acc);
      margin: 4px 0 14px;
      cursor: pointer;
    }

    button,.btn {
      appearance: none;
      -webkit-appearance: none;
      font: 500 .9rem/1 Roboto, "Google Sans", system-ui, sans-serif;
      letter-spacing: .01em;
      background: var(--acc);
      color: var(--accfg);
      border: 0;
      border-radius: 999px;
      min-height: 40px;
      padding: 0 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition:
      box-shadow .18s ease,
      background-color .18s ease,
      transform .08s ease,
      opacity .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover,.btn:hover {
      box-shadow: 0 2px 6px rgba(0,0,0,.16);
    }

    button:active,.btn:active {
      transform: scale(.98);
      box-shadow: none;
    }

    button.alt {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--outline);
    }

    button.alt:hover {
      background: var(--surface-high);
      box-shadow: none;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid color-mix(in srgb,var(--acc) 55%,transparent);
      outline-offset: 3px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    #strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 2px 2px 6px;
      scrollbar-width: thin;
    }

    .th {
      position: relative;
      flex: 0 0 88px;
    }

    .th img {
      width: 88px;
      height: 58px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      box-shadow: 0 0 0 1px color-mix(in srgb,var(--fg) 8%,transparent);
    }

    .th span {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(0,0,0,.68);
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 15px;
      line-height: 21px;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .th b {
      position: absolute;
      bottom: 5px;
      left: 5px;
      display: flex;
      gap: 3px;
    }

    .th b i {
      font-style: normal;
      background: rgba(0,0,0,.68);
      color: #fff;
      border-radius: 7px;
      width: 22px;
      height: 22px;
      line-height: 21px;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      font: 400 .95rem Roboto, "Google Sans", system-ui, sans-serif;
      width: 100%;
      min-height: 52px;
      padding: 0 44px 0 16px;
      margin: 7px 0 16px;
      border-radius: 12px;
      border: 1px solid var(--outline);
      background:
      linear-gradient(45deg,transparent 50%,var(--mut) 50%) calc(100% - 20px) 22px/6px 6px no-repeat,
      linear-gradient(135deg,var(--mut) 50%,transparent 50%) calc(100% - 15px) 22px/6px 6px no-repeat,
      var(--surface);
      color: var(--fg);
      outline: none;
    }

    select:focus {
      border: 2px solid var(--acc);
      padding-left: 15px;
      padding-right: 43px;
    }

    [hidden] {
      display: none!important
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .bar button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .bar #tog {
      margin-left: auto;
      width: 40px;
      min-width: 40px;
      height: 40px;
      min-height: 40px;
      padding: 0;
      border: 0;
    }

    #info {
      color: var(--mut);
      font-size: .82rem;
      flex-basis: 100%;
      padding: 0 4px;
    }

    video {
      width: 100%;
      border-radius: 20px;
      margin-top: 16px;
      background: #000;
    }

    #out .row {
      margin-top: 10px;
    }

    @media (max-width:520px) {
      main {
        padding: 20px 12px 40px;
      }

      h1 {
        font-size: 1.75rem;

      }

      .card {
        border-radius: 18px;
        padding: 18px;
      }

      canvas,
      video {
        border-radius: 16px;
      }

      .bar button:not(#tog) {
        flex: 1 1 auto;
      }

      .bar #tog {
        margin-left: 0;
      }

      select {
        min-height: 50px;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      button,.btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="safe-top-patch"></div>
  <main>
    <h1>FxSlide</h1>
    <canvas id="c" width="1280" height="720"></canvas>
    <div id="res" style="color:var(--mut);font-size:.9rem;margin-top:6px"></div>

    <div class="bar">
      <button id="play" aria-label="Preview"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor" /></svg><span>Preview</span></button>
      <button id="rec" aria-label="Record video"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="currentColor" /></svg><span>Record</span></button>
      <button id="tog" class="alt" aria-label="Hide settings" aria-expanded="true" title="Hide settings"></button>
      <span id="info"></span>
    </div>
    <div id="out"></div>
    <div id="panels">
      <div class="card">
        <input id="file" type="file" accept="image/*" multiple hidden>
        <div class="row">
          <button id="add">Add images</button><button id="clear" class="alt">Clear all</button>
        </div>
        <div id="strip" style="margin-top:10px"></div>
      </div>

      <div class="card">
        <label>Time each image is shown <span id="hv"></span></label>
        <input id="hold" type="range" min="0" max="15" step="0.1" value="1.5">
        <label for="tr">Transition style</label>
        <select id="tr">
          <option value="fade">Crossfade</option>
          <optgroup label="Push">
            <option value="push-r">Push left (new from right)</option><option value="push-l">Push right (new from left)</option>
            <option value="push-b">Push up (new from bottom)</option><option value="push-t">Push down (new from top)</option>
          </optgroup>
          <optgroup label="Slide over">
            <option value="slide-r">From right</option><option value="slide-l">From left</option>
            <option value="slide-b">From bottom</option><option value="slide-t">From top</option>
          </optgroup>
          <optgroup label="Wipe">
            <option value="wipe-lr">Left to right</option><option value="wipe-rl">Right to left</option>
            <option value="wipe-tb">Top to bottom</option><option value="wipe-bt">Bottom to top</option>
            <option value="wipe-tl">From top-left corner</option><option value="wipe-tr">From top-right corner</option>
            <option value="wipe-bl">From bottom-left corner</option><option value="wipe-br">From bottom-right corner</option>
          </optgroup>
          <option value="circle">Circle reveal</option>
          <option value="zoom">Zoom through</option>
          <option value="mix">Mix (cycle through styles)</option>
        </select>
        <label for="ez">Timing curve</label>
        <select id="ez">
          <option value="linear">Linear</option><option value="in">Ease in (slow start)</option><option value="out">Ease out (slow end)</option>
          <option value="inout" selected>Ease in-out</option><option value="cin">Strong ease in (cubic)</option><option value="cout">Strong ease out (cubic)</option>
          <option value="cinout">Strong ease in-out (cubic)</option><option value="expo">Expo in-out</option><option value="bounce">Bounce</option>
        </select>
        <label>Transition duration <span id="fv"></span></label>
        <input id="fade" type="range" min="0.2" max="15" step="0.1" value="1.5">
      </div>
    </div>
  </main>
  <div class="safe-bottom-patch"></div>
  <script>
    const cv = document.getElementById('c'), ctx = cv.getContext('2d', {
      alpha: false
    });
    const $ = id=>document.getElementById(id);
    let imgs = [], raf = 0, busy = false;
    const H = ()=>+$('hold').value*1000, F = ()=>+$('fade').value*1000;
    const total = ()=>imgs.length?imgs.length*H()+(imgs.length-1)*F(): 0;

    function ensureCache() {
      imgs.forEach(o => {
        if (o.cache && o.cache.width === cv.width && o.cache.height === cv.height)return;
        const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
        const x = c.getContext('2d'),
        im = o.el,
        s = Math.max(c.width/im.naturalWidth, c.height/im.naturalHeight),
        w = im.naturalWidth*s,
        h = im.naturalHeight*s;
        x.imageSmoothingQuality = 'high'; x.drawImage(im, (c.width-w)/2, (c.height-h)/2, w, h); o.cache = c;
      });
    }
    function cover(o, alpha) {
      ctx.globalAlpha = alpha; ctx.drawImage(o.cache,
        0,
        0); ctx.globalAlpha = 1
    }
    const MIX = ['fade', 'push-r', 'slide-b', 'wipe-lr', 'circle', 'push-t', 'wipe-br', 'zoom', 'slide-l', 'wipe-tb', 'push-l', 'wipe-rl'];
    const EASE = {
      linear: p=>p, in: p=>p*p, out: p=>p*(2-p), inout: p=>p*p*(3-2*p),
      cin: p=>p*p*p, cout: p=>1-Math.pow(1-p,
        3), cinout: p=>p < .5?4*p*p*p: 1-Math.pow(-2*p+2,
        3)/2,
      expo: p=>p === 0?0: p === 1?1: p < .5?Math.pow(2,
        20*p-10)/2: (2-Math.pow(2, -20*p+10))/2,
      bounce: p=> {
        const n = 7.5625, d = 2.75; if (p < 1/d)return n*p*p; if (p < 2/d)return n*(p -= 1.5/d)*p+.75; if (p < 2.5/d)return n*(p -= 2.25/d)*p+.9375; return n*(p -= 2.625/d)*p+.984375
      }
    };
    const DIR = {
      r: [1,
        0],
      l: [-1,
        0],
      b: [0,
        1],
      t: [0,
        -1]};
    function trans(A, B, p, type) {
      const W = cv.width,
      Ht = cv.height; p = Math.min(1, Math.max(0, EASE[$('ez').value](p)));
      const [k,
        d] = type.split('-');
      if (type === 'zoom') {
        ctx.drawImage(B.cache, 0, 0); const z = 1+p*0.4,
        w = W*z,
        h = Ht*z; ctx.globalAlpha = 1-p; ctx.drawImage(A.cache, (W-w)/2, (Ht-h)/2, w, h); ctx.globalAlpha = 1; return
      }
      if (k === 'push') {
        const [vx,
          vy] = DIR[d]; ctx.drawImage(A.cache, -vx*W*p, -vy*Ht*p); ctx.drawImage(B.cache, vx*W*(1-p), vy*Ht*(1-p)); return
      }
      ctx.drawImage(A.cache, 0, 0);
      if (type === 'fade') {
        cover(B, p); return
      }
      if (k === 'slide') {
        const [vx,
          vy] = DIR[d]; ctx.drawImage(B.cache, vx*W*(1-p), vy*Ht*(1-p)); return
      }
      ctx.save(); ctx.beginPath();
      if (type === 'circle')ctx.arc(W/2, Ht/2, p*Math.hypot(W, Ht)/2, 0, Math.PI*2);
      else if (d === 'lr')ctx.rect(0, 0, W*p, Ht);
      else if (d === 'rl')ctx.rect(W*(1-p), 0, W*p, Ht);
      else if (d === 'tb')ctx.rect(0, 0, W, Ht*p);
      else if (d === 'bt')ctx.rect(0, Ht*(1-p), W, Ht*p);
      else {
        const cx = d[1] === 'r'?W: 0,
        cy = d[0] === 'b'?Ht: 0,
        sx = cx?-1: 1,
        sy = cy?-1: 1;
        ctx.moveTo(cx, cy); ctx.lineTo(cx+sx*2*p*W, cy); ctx.lineTo(cx, cy+sy*2*p*Ht); ctx.closePath()}
      ctx.clip(); ctx.drawImage(B.cache, 0, 0); ctx.restore();
    }
    function draw(t) {
      if (!imgs.length) {
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.fillStyle = '#888'; ctx.font = '28px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Add images to begin', cv.width/2, cv.height/2); return
      }
      const step = H()+F();
      t = Math.max(0, t); let i = Math.max(0, Math.min(Math.floor(t/step), imgs.length-1)),
      local = t-i*step;
      if (i < imgs.length-1 && local > H()) {
        let type = $('tr').value; if (type === 'mix')type = MIX[i%MIX.length];
        trans(imgs[i], imgs[i+1], Math.min((local-H())/F(), 1), type);
      } else cover(imgs[i], 1);
    }
    function run(onDone) {
      const T = total(),
      start = performance.now();
      (function f(now) {
        const t = Math.max(0, Math.min(now-start, T)); draw(t);
        if (t < T)raf = requestAnimationFrame(f); else {
          raf = 0; onDone && onDone()}
      })(start);
    }
    function setBusy(b) {
      busy = b; $('play').disabled = $('rec').disabled = b
    }
    function info() {
      $('hv').textContent = $('hold').value+' s'; $('fv').textContent = $('fade').value+' s';
      $('info').textContent = imgs.length > 1?imgs.length+' images · total '+(total()/1000).toFixed(1)+' s': 'Add at least 2 images.';
    }
    function strip() {
      const s = $('strip'); s.innerHTML = '';
      imgs.forEach((o, i)=> {
        const d = document.createElement('div'); d.className = 'th';
        d.innerHTML = '<img src="'+o.url+'" alt="Image '+(i+1)+'"><span title="Remove">×</span><b><i title="Move left">‹</i><i title="Move right">›</i></b>';
        d.querySelector('span').onclick = ()=> {
          if (busy)return; imgs.splice(i, 1); refresh()};
        const [l,
          r] = d.querySelectorAll('i');
        l.onclick = ()=> {
          if (!busy && i > 0) {[imgs[i-1],
            imgs[i]] = [imgs[i],
            imgs[i-1]]; refresh()}};
        r.onclick = ()=> {
          if (!busy && i < imgs.length-1) {[imgs[i+1],
            imgs[i]] = [imgs[i],
            imgs[i+1]]; refresh()}};
        s.appendChild(d);
      });
    }
    const MAX = 2048;
    function sizeCanvas() {
      let w = 1280, h = 720;
      if (imgs.length) {
        w = imgs[0].el.naturalWidth; h = imgs[0].el.naturalHeight;
        const k = Math.min(1, MAX/Math.max(w, h)); w *= k; h *= k;
      }
      w = Math.max(2, Math.round(w/2)*2); h = Math.max(2, Math.round(h/2)*2);
      if (cv.width !== w || cv.height !== h) {
        cv.width = w; cv.height = h
      }
      $('res').textContent = 'Output: '+w+' × '+h+(imgs.length?' (first image'+(Math.max(imgs[0].el.naturalWidth, imgs[0].el.naturalHeight) > MAX?', scaled to 2K max': ', original size')+')': '');
    }
    function refresh() {
      if (busy)return; sizeCanvas(); ensureCache(); strip(); info(); draw(0)}

    $('add').onclick = ()=>$('file').click();
    $('clear').onclick = ()=> {
      if (busy)return; imgs = []; $('out').innerHTML = ''; refresh()};
    $('file').onchange = async e => {
      if (busy) {
        e.target.value = ''; return
      }
      const loaded = await Promise.all([...e.target.files].map(f => new Promise(res => {
        const url = URL.createObjectURL(f), el = new Image();
        el.onload = ()=>res( {
          el, url
        }); el.onerror = ()=>res(null); el.src = url;
      })));
      imgs.push(...loaded.filter(Boolean)); e.target.value = ''; refresh();
    };
    $('hold').oninput = $('fade').oninput = info;

    $('play').onclick = ()=> {
      if (imgs.length < 2)return; cancelAnimationFrame(raf); setBusy(true); run(()=>setBusy(false));
    };
    $('rec').onclick = ()=> {
      if (imgs.length < 2)return;
      if (!window.MediaRecorder) {
        $('out').textContent = 'This browser cannot record video.'; return
      }
      const mime = ['video/mp4;codecs=avc1',
        'video/webm;codecs=vp8',
        'video/webm;codecs=vp9',
        'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
      const rec = new MediaRecorder(cv.captureStream(30), {
        mimeType: mime, videoBitsPerSecond: Math.round(cv.width*cv.height*30*0.08)}),
      chunks = [];
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      rec.onstop = ()=> {
        const type = mime.split(';')[0],
        ext = type.includes('mp4')?'mp4': 'webm',
        url = URL.createObjectURL(new Blob(chunks, {
          type
        }));
        $('out').innerHTML = '<video controls src="'+url+'"></video><div class="row"><a class="btn" download="crossfade.'+ext+'" href="'+url+'">Download '+ext.toUpperCase()+'</a></div>';
        setBusy(false);
      };
      $('out').textContent = 'Recording…'; setBusy(true); rec.start();
      run(()=>setTimeout(()=>rec.stop(), 200));
    };
    const ICON_HIDE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>', ICON_SHOW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>';
    function setPanels(open) {
      $('panels').hidden=!open; const t = $('tog');
      t.innerHTML = open?ICON_HIDE: ICON_SHOW;
      t.setAttribute('aria-expanded', open); t.setAttribute('aria-label', open?'Hide settings': 'Show settings'); t.title = open?'Hide settings': 'Show settings';
    }
    $('tog').onclick = ()=>setPanels($('panels').hidden);
    setPanels(true);
    refresh();
  </script>
</body>
</html>
